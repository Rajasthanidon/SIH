<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Java Assessment</title>
</head>

<body>

    <main class="test-page">

        <button class="menu-button" type="button" aria-label="Open menu">
            ☰
        </button>

        <header class="test-header">

            <div class="test-title">
                <h1>Java Assessment</h1>
                <p>Test your knowledge and identify your skill level.</p>
            </div>

            <div class="timer">
                <span>⏱</span>
                <strong>14:32</strong>
            </div>

        </header>

        <div class="test-progress">

            <div class="progress-info">
                <span>Question 3 of 10</span>
                <span>30% Complete</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

        </div>

        <section class="question-container">

            <div class="question-card">

                <div class="question-label">
                    Question 3
                </div>

                <h2>
                    Which of the following best describes polymorphism in Java?
                </h2>

                <div class="options">

                    <label class="option">
                        <input type="radio" name="answer" value="a">
                        <span class="option-letter">A</span>
                        <span class="option-text">
                            Ability of an object to take multiple forms
                        </span>
                    </label>

                    <label class="option">
                        <input type="radio" name="answer" value="b">
                        <span class="option-letter">B</span>
                        <span class="option-text">
                            Ability to create multiple classes
                        </span>
                    </label>

                    <label class="option">
                        <input type="radio" name="answer" value="c">
                        <span class="option-letter">C</span>
                        <span class="option-text">
                            Ability to hide implementation details
                        </span>
                    </label>

                    <label class="option">
                        <input type="radio" name="answer" value="d">
                        <span class="option-letter">D</span>
                        <span class="option-text">
                            Ability to inherit multiple classes
                        </span>
                    </label>

                </div>

                <div class="question-actions">

                    <button type="button" class="previous-button">
                        ← Previous
                    </button>

                    <button type="button" class="next-button">
                        Next →
                    </button>

                </div>

            </div>

            <aside class="question-navigation">

                <h2>Questions</h2>

                <div class="question-numbers">

                    <button class="answered">1</button>
                    <button class="answered">2</button>
                    <button class="current">3</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>10</button>

                </div>

                <div class="navigation-info">
                    <p>
                        <span class="status-dot answered-dot"></span>
                        Answered
                    </p>

                    <p>
                        <span class="status-dot current-dot"></span>
                        Current
                    </p>

                    <p>
                        <span class="status-dot unanswered-dot"></span>
                        Unanswered
                    </p>
                </div>

            </aside>

        </section>

        <div class="test-footer">
            <span>10 Questions</span>
            <button type="button" class="submit-test-button">
                Submit Assessment
            </button>
        </div>

    </main>

</body>

</html>
